[project]
name = "commitminer"
version = "0.1.0"
description = "Mine and rank candidate fail-to-pass tasks from real repository history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28.1",
    "typer>=0.27.2",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.scripts]
commitminer = "commitminer.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commitminer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PTH", "RET"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["commitminer"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
