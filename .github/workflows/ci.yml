name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests with coverage gate
        run: make cov
      - name: Demo (recorded tomli history, then a batch with a Go fork pair, offline)
        run: make demo
      - name: Explain demo (one candidate, one rejected commit)
        run: make demo-explain
      - name: Classifier demo (multi-language sample tree)
        run: make demo-classify
      - name: Ledger demo (cherry-picks, a re-indented and moved fork)
        run: make demo-ledger
      - name: Pull-request demo (recorded GitHub responses, offline)
        run: make demo-prs
      - name: Report demo (export schema 6, Markdown and HTML reports)
        run: make demo-report
      - name: Exported candidates validate against the committed JSON Schema
        run: |
          uv run python -c '
          import json, sys
          from jsonschema import Draft202012Validator
          from commitminer.export import schema_text
          validator = Draft202012Validator(json.loads(schema_text()))
          for name in ("out/tomli-candidates.jsonl", "out/batch-candidates.jsonl"):
              records = [json.loads(line) for line in open(name)]
              for record in records:
                  validator.validate(record)
              kinds = [record["kind"] for record in records]
              print(name, len(records), "records valid:", kinds[0], "+",
                    kinds.count("run"), "runs +", kinds.count("candidate"), "candidates")'
      - name: Recordings still match upstream (tomli and the mapstructure pair)
        run: make verify-recording

  docker:
    name: docker build + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build image
        run: docker build -t commitminer:ci .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id commitminer:ci -u)" = "10001"
      - name: Demo inside the image (recorded tomli history)
        run: docker run --rm commitminer:ci mine --history examples/tomli/history.jsonl.gz --top 5
      - name: Classifier inside the image (sample tree and its commitminer.toml)
        run: |
          docker run --rm commitminer:ci classify --root examples/classify \
            src/lib.rs internal/kind/kind_string.go web/static/bundle.js fixtures/percent.json
      - name: Explain a recorded commit inside the image
        run: |
          docker run --rm commitminer:ci explain 948211d852 \
            --history examples/tomli/history.jsonl.gz
      - name: Ledger inside the image (demo repositories built in the container)
        run: |
          docker run --rm --entrypoint sh commitminer:ci -c '
            set -e
            python examples/ledger/build_repos.py /tmp/demo
            commitminer mine /tmp/demo/upstream --top 0 --explain 0 --out /tmp/up.jsonl
            commitminer ledger add /tmp/ledger.sqlite3 /tmp/up.jsonl --owner ci
            commitminer mine /tmp/demo/fork --top 5 --explain 0 --ledger /tmp/ledger.sqlite3
            commitminer ledger list /tmp/ledger.sqlite3'
      - name: Batch inside the image (tomli and a Go fork pair into one ledger, then resumed)
        run: |
          docker run --rm --network none --entrypoint sh commitminer:ci -c '
            set -e
            commitminer batch examples/batch/commitminer.toml --ledger /tmp/l.sqlite3 --top 3
            commitminer batch examples/batch/commitminer.toml --ledger /tmp/l.sqlite3 --top 0
            commitminer ledger watermarks /tmp/l.sqlite3'
      - name: Pull requests inside the image (recorded GitHub responses, no network)
        run: |
          docker run --rm --network none commitminer:ci prs hukkin/tomli --limit 25 \
            --replay examples/tomli/prs --top 5 --explain 0
      - name: Export and report inside the image
        run: |
          docker run --rm --entrypoint sh commitminer:ci -c '
            set -e
            commitminer mine --history examples/tomli/history.jsonl.gz --top 0 --explain 0 \
              --out /tmp/candidates.jsonl
            commitminer report /tmp/candidates.jsonl --top 3 | head -20
            commitminer report /tmp/candidates.jsonl --format html --top 3 | grep -c "<details>"
            commitminer schema | head -3'
      - name: Mine this repository's own history inside the image
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" commitminer:ci \
            mine /repo --top 5 --explain 0
